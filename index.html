<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html{color-scheme:light}body{margin:0}</style></head><body>
<title>Gerador de Cronogramas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: lista de cronogramas à esquerda; à direita título, abas "Cronograma" (tabela + Gantt como na planilha) e "Próximos passos". */
:root{
  --bg:#F5F4F3; --surface:#FFFFFF; --surface2:#FAF9F8; --ink:#201C1C; --muted:#6C6564; --line:#E3DFDD; --line2:#CFC9C6;
  --accent:#D93A3A; --accent-ink:#FFFFFF; --accent-soft:#FCE9E8;
  --hd:#C0504D; --wk:#E03030; --bar:#FF5050; --sec:#F2F2F2; --sec-line:#D9D9D9; --we:#F3F1F0; --today:#9C0006;
  --ok-bg:#C6EFCE; --ok-fg:#006100; --warn-bg:#FFEB9C; --warn-fg:#9C5700; --run-bg:#A9D08E; --run-fg:#1F3A12; --late:#B3261E;
  --font-ui:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --font-mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161313; --surface:#1F1B1B; --surface2:#252020; --ink:#F0ECEB; --muted:#A59D9B; --line:#352F2F; --line2:#4A4242;
  --accent:#F0605F; --accent-ink:#1A0F0F; --accent-soft:#3A2121;
  --hd:#8E3A38; --wk:#A82A2A; --bar:#E04848; --sec:#2A2525; --sec-line:#3C3535; --we:#231F1F; --today:#FF8A86;
  --ok-bg:#1F4A2A; --ok-fg:#A6E3B3; --warn-bg:#4D3F12; --warn-fg:#F2D98A; --run-bg:#3C5A2A; --run-fg:#CFE8BE; --late:#FF8A80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161313; --surface:#1F1B1B; --surface2:#252020; --ink:#F0ECEB; --muted:#A59D9B; --line:#352F2F; --line2:#4A4242;
  --accent:#F0605F; --accent-ink:#1A0F0F; --accent-soft:#3A2121;
  --hd:#8E3A38; --wk:#A82A2A; --bar:#E04848; --sec:#2A2525; --sec-line:#3C3535; --we:#231F1F; --today:#FF8A86;
  --ok-bg:#1F4A2A; --ok-fg:#A6E3B3; --warn-bg:#4D3F12; --warn-fg:#F2D98A; --run-bg:#3C5A2A; --run-fg:#CFE8BE; --late:#FF8A80; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:14px;line-height:1.45;
  padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.app{max-width:1500px;margin:0 auto;display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;align-items:start}
@media(max-width:900px){.app{grid-template-columns:minmax(0,1fr)}}

/* botões */
.btn{border:1px solid var(--line2);background:var(--surface);border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface2);border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.danger{color:var(--late)}
.btn:disabled{opacity:.55;cursor:default}
.btn.sm{padding:4px 9px;font-size:13px}

/* lateral */
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.brand{display:flex;flex-direction:column;gap:2px;padding-bottom:4px}
.brand b{font-size:17px;font-weight:600;letter-spacing:-.01em}
.brand span{color:var(--muted);font-size:13px}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.item{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:9px 11px;cursor:pointer;display:flex;flex-direction:column;gap:1px}
.item:hover{border-color:var(--line2)}
.item.on{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.item b{font-weight:600;overflow-wrap:anywhere}
.item small{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.side-actions{display:flex;flex-direction:column;gap:6px}
.newform{background:var(--surface);border:1px solid var(--line2);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:9px}
.newform .row{display:flex;gap:8px}
.lbl{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);font-weight:500;min-width:0}
.lbl input,.lbl select,.lbl textarea{color:var(--ink);font-size:14px;font-weight:400}
.fld{border:1px solid var(--line2);background:var(--surface);border-radius:6px;padding:6px 8px;min-width:0;width:100%}
.fld:hover{border-color:var(--muted)}

/* principal */
.main{min-width:0;display:flex;flex-direction:column;gap:14px}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.title-in{font-size:22px;font-weight:600;letter-spacing:-.015em;border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 8px;margin-left:-8px;flex:1 1 320px;min-width:0}
.title-in:hover,.title-in:focus{border-color:var(--line2);background:var(--surface)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.settings{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.settings .lbl{width:auto}
.settings .fld{width:auto}
.upd{font-variant-numeric:tabular-nums;font-family:var(--font-mono);font-size:13px;padding:7px 0}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:9px 14px;cursor:pointer;font-weight:500;color:var(--muted);margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 12px;display:flex;gap:8px;align-items:baseline}
.stat b{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:12px}
.stat.late b{color:var(--late)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hint{color:var(--muted);font-size:13px}

/* tabela + gantt */
.gwrap{border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:auto;max-height:72vh}
table.gt{border-collapse:separate;border-spacing:0;table-layout:fixed}
.gt th,.gt td{padding:0;border-bottom:1px solid var(--line);height:34px;vertical-align:middle}
.gt thead th{position:sticky;z-index:3;color:#fff;font-weight:600;text-align:center}
.gt .h1{top:0;height:26px;background:var(--wk);font-size:12px;border-left:1px solid rgba(255,255,255,.35);white-space:nowrap}
.gt .h2{top:26px;height:20px;background:var(--wk);font-size:10px;font-family:var(--font-mono);border-left:1px solid rgba(255,255,255,.2)}
.gt .h3{top:46px;height:26px;background:var(--hd);font-size:11px;letter-spacing:.03em}
.gt .h3.l{font-size:11px}
.gt .corner{top:0;background:var(--surface);color:var(--muted);font-weight:400;text-align:left;padding:6px 10px;font-size:12px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.35}
.gt .dl{font-size:9px;font-weight:600;text-transform:uppercase}
.gt .stk{position:sticky;left:0;z-index:2;background:var(--surface);border-right:1px solid var(--line)}
.gt thead .stk{z-index:4;background:var(--hd)}
.gt td{font-size:13px}
.gt td.stk textarea{min-height:30px}
.gt td input,.gt td textarea{background:transparent;border:1px solid transparent;border-radius:4px;width:100%;padding:5px 7px;min-width:0}
.gt td input:hover,.gt td textarea:hover{border-color:var(--line2)}
.gt td input:focus,.gt td textarea:focus{border-color:var(--accent);background:var(--surface)}
.gt .compact-only{display:none}
.gt.compact .dcol{visibility:collapse}
.gt.compact td:nth-child(n+2):nth-child(-n+8) *{display:none}
.gt.compact td:nth-child(n+2):nth-child(-n+8){height:34px}
.gt td textarea{resize:none;field-sizing:content;min-height:30px;max-height:120px;display:block;line-height:1.35;overflow:auto}
.gt td input[type=date]{font-family:var(--font-mono);font-size:12px;padding:5px 4px}
.gt td input[type=date]:disabled{color:var(--muted);opacity:1}
.gt td input[type=number]{font-family:var(--font-mono);font-size:13px;text-align:center;-moz-appearance:textfield}
.gt tr.sec td{background:var(--sec);border-top:1px solid var(--sec-line);border-bottom:2px solid var(--sec-line);height:32px}
.gt tr.sec td.stk{background:var(--sec)}
.gt tr.sec input{font-weight:600}
.gt td.pr{padding:3px 4px}
.pb{position:relative;border-radius:4px;overflow:hidden;background:linear-gradient(90deg,color-mix(in srgb,var(--run-bg) 85%,transparent) var(--p,0%),transparent var(--p,0%))}
.pb input{text-align:center}
.stt{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:500;background:var(--run-bg);color:var(--run-fg);white-space:nowrap}
.stt.s0{background:var(--warn-bg);color:var(--warn-fg)}
.stt.s2{background:var(--ok-bg);color:var(--ok-fg)}
td.c-st{text-align:center}
td.ed{display:flex;align-items:center;height:auto}
.gt tr.t td.ed{display:table-cell}
.dte{display:flex;align-items:center;gap:2px;padding-right:2px}
.chain{border:1px solid var(--line2);background:var(--surface);color:var(--muted);border-radius:4px;width:24px;height:24px;flex:none;cursor:pointer;font-size:13px;line-height:1;padding:0}
.chain.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.late input.ef{color:var(--late);font-weight:500}
td.sp{width:8px;padding:0;border-bottom:1px solid var(--line)}
td.gc{width:20px;min-width:20px;padding:0;border-left:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
td.gc.we{background:var(--we)}
td.gc.bar{background:var(--bar);border-left-color:var(--bar)}
td.gc.td{box-shadow:inset 1px 0 0 var(--today),inset -1px 0 0 var(--today)}
tr.sec td.gc{background:var(--sec)}
.gt th.td-h{box-shadow:inset 0 -3px 0 #fff}
td.act{white-space:nowrap;text-align:center;padding:0 4px}
.ib{border:1px solid transparent;background:transparent;color:var(--muted);border-radius:4px;width:24px;height:24px;cursor:pointer;line-height:1;padding:0}
.ib:hover{border-color:var(--line2);color:var(--ink);background:var(--surface2)}
.ib.x:hover{color:var(--late)}
tr.new td{animation:flash 2.4s ease-out}
tr.new td.gc.bar{animation:none}
@keyframes flash{0%{background:var(--accent-soft)}100%{background:transparent}}
@media (prefers-reduced-motion:reduce){tr.new td{animation:none}}
.addbar{display:flex;gap:8px;flex-wrap:wrap}
.empty{border:1px dashed var(--line2);border-radius:8px;padding:22px;text-align:center;color:var(--muted);background:var(--surface)}

/* próximos passos */
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.dz{border:1.5px dashed var(--line2);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--surface2)}
.dz.over{border-color:var(--accent);background:var(--accent-soft)}
.steps{margin:0;padding-left:18px;color:var(--muted);font-size:13px;display:flex;flex-direction:column;gap:2px}
.two{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:1100px){.two{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{margin:0;font-size:15px;font-weight:600}
.card h3{margin:0;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.draft{border:1px solid var(--line2);border-radius:8px;padding:12px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;background:var(--surface2)}
.draft .c6{grid-column:span 6}.draft .c3{grid-column:span 3}.draft .c2{grid-column:span 2}
@media(max-width:560px){.draft .c3,.draft .c2{grid-column:span 6}}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);padding-top:2px}
.dhead{display:flex;justify-content:space-between;align-items:center;grid-column:span 6;font-size:12px;color:var(--muted);font-weight:500}
.pend{display:flex;flex-direction:column;gap:6px}
.pi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:9px 10px;border:1px solid var(--line);border-radius:6px;align-items:center}
.pi b{font-weight:500;overflow-wrap:anywhere}
.pi small{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;grid-column:1}
.pi .pcontrols{grid-column:2;grid-row:1 / span 2;display:flex;gap:6px;align-items:center}
.pi .pcontrols input{width:62px;text-align:center;font-family:var(--font-mono)}
.pi.late{border-left:3px solid var(--late)}
.pi.run{border-left:3px solid var(--run-fg)}
.pi.next{border-left:3px solid var(--line2)}
.tag{white-space:nowrap;display:inline-block;font-size:11px;font-weight:600;padding:1px 6px;border-radius:3px;background:var(--accent-soft);color:var(--late);margin-left:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(20px,env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13px;z-index:50;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.25)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>

<div class="app">
  <aside class="side" id="side" aria-label="Cronogramas"></aside>
  <main class="main" id="main"></main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<input type="file" id="fx" accept=".xlsx" class="sr" tabindex="-1" aria-hidden="true">
<input type="file" id="fp" accept=".xlsx" class="sr" tabindex="-1" aria-hidden="true">
<input type="file" id="fj" accept=".json,application/json" class="sr" tabindex="-1" aria-hidden="true">
<input type="file" id="fl" accept="image/png,image/jpeg" class="sr" tabindex="-1" aria-hidden="true">

const KEY='gerador-cronogramas-v1';
const MON=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const DL=['d','s','t','q','q','s','s'];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const uid=()=>Math.random().toString(36).slice(2,9);
const dn=iso=>iso?Math.floor(Date.UTC(+iso.slice(0,4),+iso.slice(5,7)-1,+iso.slice(8,10))/864e5):null;
const toISO=n=>n==null?'':new Date(n*864e5).toISOString().slice(0,10);
const todayDn=()=>{const d=new Date();return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5)};
const dow=n=>new Date(n*864e5).getUTCDay();
const dpart=n=>{const d=new Date(n*864e5);return{d:d.getUTCDate(),m:d.getUTCMonth(),y:d.getUTCFullYear()}};
const fmt=n=>{if(n==null)return'';const p=dpart(n);return pad(p.d)+'/'+pad(p.m+1)+'/'+String(p.y).slice(2)};
const fmtWk=n=>{const p=dpart(n);return p.d+'-'+MON[p.m]+'-'+String(p.y).slice(2)};
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));

/* ---------- dados ---------- */
function seed(){
  const t0=todayDn()-((dow(todayDn())+6)%7);
  const T=(name,owner,progress,a,b,note)=>({type:'task',id:uid(),name,owner,progress,start:toISO(t0+a),end:toISO(t0+b),note:note||'',after:false,dur:null});
  const S=name=>({type:'section',id:uid(),name});
  return{id:uid(),title:'Exemplo de cronograma',projectStart:toISO(t0),logo:'none',logoData:'',updatedAt:Date.now(),rows:[
    S('Planejamento'),
    T('Levantar requisitos','Equipe de projeto',100,0,3,'Exemplo: apague ou edite à vontade'),
    T('Definir responsáveis','Gestão',100,2,4,''),
    S('Execução'),
    T('Treinar a equipe','Melhoria Contínua',50,7,11,'Exemplo de observação'),
    T('Acompanhar a operação','Operações',0,14,20,''),
    S('Encerramento'),
    T('Reunião de encerramento','Todos',0,28,28,'')
  ]};
}
function blank(title,startISO){
  return{id:uid(),title:title||'Novo cronograma',projectStart:startISO||toISO(todayDn()),logo:'none',logoData:'',updatedAt:Date.now(),
    rows:[{type:'section',id:uid(),name:'Planejamento'},{type:'section',id:uid(),name:'Execução'},{type:'section',id:uid(),name:'Encerramento'}]};
}
let S={items:[],cur:null,tab:'sched',drafts:[],target:'',newSec:'',newOpen:false,confirmDel:false,flash:new Set(),busy:false};
function load(){
  try{const raw=localStorage.getItem(KEY);if(raw){const o=JSON.parse(raw);if(o&&Array.isArray(o.items)&&o.items.length){S.items=o.items;S.cur=o.cur&&o.items.some(x=>x.id===o.cur)?o.cur:o.items[0].id;return}}}catch(e){}
  const s=seed();S.items=[s];S.cur=s.id;
}
let saveT=null;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify({items:S.items,cur:S.cur}))}catch(e){}},300)}
const cur=()=>S.items.find(x=>x.id===S.cur)||S.items[0];
function touch(){cur().updatedAt=Date.now();save()}

/* ---------- cálculo ---------- */
function resolve(s){
  const out=[];let prevEnd=null,have=false,prevIdx=-1;
  s.rows.forEach((r,i)=>{
    if(r.type!=='task'){out.push(null);return}
    let st=dn(r.start),en=dn(r.end),after=false,pi=-1;
    if(r.after&&have){after=true;pi=prevIdx;st=prevEnd!=null?prevEnd+1:null;en=st!=null?st+Math.max(1,r.dur||1)-1:null}
    out.push({st,en,after,prev:pi,dias:(st!=null&&en!=null)?en-st+1:null});
    have=true;prevEnd=en;prevIdx=i;
  });
  return out;
}
const statusOf=p=>p<=0?0:p>=100?2:1;
const STT=['Não iniciado','Em andamento','Finalizado'];
function gridInfo(s,R){
  let min=null,max=null;
  R.forEach(x=>{if(!x)return;if(x.st!=null)min=min==null?x.st:Math.min(min,x.st);if(x.en!=null)max=max==null?x.en:Math.max(max,x.en)});
  if(min==null)min=dn(s.projectStart)||todayDn();
  if(max==null)max=min+83;
  const start=min-((dow(min)+6)%7);
  const weeks=clamp(Math.max(12,Math.ceil((max-start+1)/7)+1),12,104);
  return{start,weeks,key:start+':'+weeks};
}

function goToday(){
  const w=document.querySelector('.gwrap');if(!w)return;
  const s=cur(),g=gridInfo(s,resolve(s));
  const left=COLW.reduce((a,b,k)=>a+((S.compact&&k>=1&&k<=7)?0:b),0)+8;
  const x=left+(todayDn()-g.start)*20;
  const fixed=S.compact?COLW[0]+COLW[8]:COLW[0];
  w.scrollTo({left:Math.max(0,x-(w.clientWidth-fixed)/2-fixed*0),behavior:'smooth'});
}
function acts(i,s){
  return `<button class="ib" data-a="up" title="Mover para cima" aria-label="Mover para cima"${i===0?' disabled':''}>↑</button><button class="ib" data-a="down" title="Mover para baixo" aria-label="Mover para baixo"${i===s.rows.length-1?' disabled':''}>↓</button><button class="ib x" data-a="del" title="Excluir linha" aria-label="Excluir linha">×</button>`;

/* atualiza os valores calculados sem recriar as células (mantém o foco) */
function refresh(){
  const s=cur(),R=resolve(s),g=gridInfo(s,R),today=todayDn();
  const tb=document.querySelector('#gt tbody');if(!tb)return;
  const ae=document.activeElement;
  const setV=(inp,v)=>{if(inp&&inp!==ae&&inp.value!==String(v))inp.value=v};
  tb.querySelectorAll('tr').forEach(tr=>{
    const i=+tr.dataset.i,r=s.rows[i],x=R[i];if(!r||!x)return;
    const st=statusOf(r.progress||0);
    const c=tr.querySelector('.c-st');c.innerHTML=`<span class="stt s${st}">${STT[st]}</span>`;
    const pb=tr.querySelector('.pb');pb.style.setProperty('--p',clamp(r.progress||0,0,100)+'%');
    const si=tr.querySelector('[data-f=start]');setV(si,toISO(x.st));si.disabled=x.after;
    const ch=tr.querySelector('.chain');ch.classList.toggle('on',x.after);ch.setAttribute('aria-pressed',x.after);
    setV(tr.querySelector('[data-f=end]'),toISO(x.en));
    setV(tr.querySelector('[data-f=dias]'),x.dias==null?'':x.dias);
    tr.classList.toggle('late',(r.progress||0)<100&&x.en!=null&&x.en<today);
    const cells=tr.querySelectorAll('td.gc');
    for(let k=0;k<cells.length;k++){const d=g.start+k;cells[k].classList.toggle('bar',x.st!=null&&x.en!=null&&d>=x.st&&d<=x.en)}
  });
  // resumo
  const tasks=s.rows.map((r,i)=>r.type==='task'?{r,x:R[i]}:null).filter(Boolean);
  const cnt=[0,0,0];tasks.forEach(t=>cnt[statusOf(t.r.progress||0)]++);
  const late=tasks.filter(t=>(t.r.progress||0)<100&&t.x.en!=null&&t.x.en<today).length;
  const avg=tasks.length?Math.round(tasks.reduce((a,t)=>a+(t.r.progress||0),0)/tasks.length):0;
  const st=$('#stats');if(st)st.innerHTML=`<div class="stat"><b>${tasks.length}</b><span>tarefas</span></div><div class="stat"><b>${avg}%</b><span>progresso geral</span></div><div class="stat"><b>${cnt[2]}</b><span>finalizadas</span></div><div class="stat"><b>${cnt[1]}</b><span>em andamento</span></div><div class="stat"><b>${cnt[0]}</b><span>não iniciadas</span></div><div class="stat late"><b>${late}</b><span>atrasadas</span></div>`;
}

  renderSide();
}

  s.rows.forEach((r,i)=>{if(r.type!=='task'||(r.progress||0)>=100)return;const x=R[i];

    right+='</div>'});

  $('#body').innerHTML=`<div class="two"><div class="col">${imp}${left}</div><div>${right}</div></div><datalist id="owners">${[...new Set(s.rows.filter(r=>r.type==='task'&&r.owner).map(r=>r.owner))].map(o=>`<option value="${esc(o)}">`).join('')}</datalist>`;

function parseD(t){
  t=(t||'').trim();let m;
  if(m=t.match(/^(\d{4})-(\d{2})-(\d{2})$/))return dn(t);
  if(m=t.match(/^(\d{1,2})[\/.-](\d{1,2})(?:[\/.-](\d{2,4}))?$/)){let y=m[3]?+m[3]:new Date().getFullYear();if(y<100)y+=2000;return Math.floor(Date.UTC(y,+m[2]-1,+m[1])/864e5)}
  return null;
}
function parseLines(txt){
  const out=[];
  txt.split(/\r?\n/).forEach(line=>{
    if(!line.trim())return;
    const p=line.split(/\t|;|\|/).map(x=>x.trim());
    const d=newDraft({name:p[0],owner:p[1]||'',note:p.slice(4).filter(Boolean).join(' / ')});
    const a=p[2]||'',b=p[3]||'';
    const sd=parseD(a);
    if(sd!=null){d.after=false;d.start=toISO(sd);
      const ed=parseD(b);
      if(ed!=null)d.dur=Math.max(1,ed-sd+1);else{const m=b.match(/^(\d+)\s*(d|dia|dias)?$/i);if(m)d.dur=Math.max(1,+m[1])}
    }else{
      d.after=true;
      const m=(b||a).match(/^(\d+)\s*(d|dia|dias)?$/i);if(m)d.dur=Math.max(1,+m[1]);
    }
    out.push(d);
  });
  return out;
}
const norm=v=>String(v==null?'':v).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
function applyBatch(items){
  const s=cur();
  S.undo={sid:s.id,rows:JSON.parse(JSON.stringify(s.rows))};
  let defId=(S.target!=='__new'&&s.rows[+S.target]&&s.rows[+S.target].type==='section')?s.rows[+S.target].id:null;
  const ensureDefault=()=>{if(defId)return defId;const id=uid();s.rows.push({type:'section',id,name:(S.newSec||'').trim()||'Próximos passos'});S.flash.add(id);defId=id;return id};
  items.forEach(it=>{
    let sid;
    if(it.section){
      const k=s.rows.findIndex(r=>r.type==='section'&&norm(r.name)===norm(it.section));
      if(k>=0)sid=s.rows[k].id;else{sid=uid();s.rows.push({type:'section',id:sid,name:it.section});S.flash.add(sid)}
    }else sid=ensureDefault();
    const si=s.rows.findIndex(r=>r.id===sid);let j=si+1;while(j<s.rows.length&&s.rows[j].type!=='section')j++;
    s.rows.splice(j,0,it.task);S.flash.add(it.task.id);
  });
}
function mkTask(o){
  const dur=Math.max(1,parseInt(o.dur)||1);
  const after=!!o.after||!o.start;

async function importSteps(file){
  const wb=new ExcelJS.Workbook();await wb.xlsx.load(await file.arrayBuffer());
  const ws=wb.getWorksheet('Passos')||wb.worksheets[0];
  if(!ws)throw new Error('planilha vazia');
  let hr=0,m={};
  for(let r=1;r<=Math.min(ws.rowCount,30)&&!hr;r++){
    const mm={};
    for(let c=1;c<=20;c++){
      const t=norm(cv(ws.getCell(r,c)));if(!t)continue;
      if(t.startsWith('secao')||t==='fase'||t==='etapa')mm.sec=c;
      else if(t.startsWith('tarefa')||t.startsWith('passo')||t.startsWith('atividade'))mm.name=c;
      else if(t.startsWith('responsavel'))mm.owner=c;
      else if(t.startsWith('inicio'))mm.start=c;
      else if(t.startsWith('duracao')||t==='dias')mm.dur=c;
      else if(t.startsWith('termino')||t==='fim')mm.end=c;
      else if(t.startsWith('progresso'))mm.prog=c;
      else if(t.startsWith('observ'))mm.note=c;
    }
    if(mm.name){hr=r;m=mm}
  }
  if(!hr)throw new Error('não encontrei a coluna TAREFA. Use o modelo baixado no sistema.');
  const items=[];let skipped=0;
  for(let r=hr+1;r<=ws.rowCount;r++){
    const nm=cv(ws.getCell(r,m.name));
    if(nm==null)continue;
    const name=String(nm);
    if(norm(name).startsWith('(exemplo)')){skipped++;continue}
    const g=k=>m[k]?cv(ws.getCell(r,m[k])):null;
    const st=dateIso(g('start')),en=dateIso(g('end'));
    let dur=g('dur');dur=typeof dur==='number'?Math.round(dur):(typeof dur==='string'&&/^\d+/.test(dur)?parseInt(dur):null);
    if(!(dur>0))dur=null;
    let pr=g('prog');
    if(typeof pr==='string')pr=parseFloat(pr.replace('%','').replace(',','.'));
    if(typeof pr==='number'&&m.prog&&String(ws.getCell(r,m.prog).numFmt||'').includes('%'))pr=pr*100;
    const sec=g('sec');
    let o={name,owner:g('owner')||'',note:g('note')||'',progress:typeof pr==='number'&&!isNaN(pr)?pr:0};
    if(st){
      let e=en;if(dur)e=toISO(dn(st)+dur-1);else if(!e)e=st;
      if(dn(e)<dn(st))e=st;
      o.start=st;o.end=e;o.dur=dn(e)-dn(st)+1;o.after=false;
    }else{o.after=true;o.dur=dur||(en?5:5)}
    items.push({section:sec?String(sec):null,task:mkTask(o)});
  }
  return{items,skipped};
}

function cv(cell){
  let v=cell.value;
  if(v&&typeof v==='object'&&!(v instanceof Date)){
    if('result' in v)v=v.result;else if(v.richText)v=v.richText.map(t=>t.text).join('');else if(v.text)v=v.text;
  }
  if(typeof v==='string')v=v.replace(/ /g,' ').trim();
  return v===undefined||v===''?null:v;
}
function dateIso(v){
  if(v==null)return null;
  if(v instanceof Date)return v.toISOString().slice(0,10);
  if(typeof v==='number')return toISO(Math.floor(v)-25569);
  if(typeof v==='string'){const n=parseD(v);return n==null?null:toISO(n)}
  return null;
}
async function importXlsx(file){
  const wb=new ExcelJS.Workbook();await wb.xlsx.load(await file.arrayBuffer());
  const ws=wb.worksheets[0];if(!ws)throw new Error('Planilha vazia');
  let hr=0;
  for(let r=1;r<=Math.min(ws.rowCount,20);r++){const v=cv(ws.getCell(r,1));if(typeof v==='string'&&v.toUpperCase()==='TAREFA'){hr=r;break}}
  if(!hr)throw new Error('Não encontrei o cabeçalho "TAREFA" na coluna A.');
  let title='',start=null;
  for(let r=1;r<hr;r++){
    const a=cv(ws.getCell(r,1));if(typeof a==='string'&&a&&!title)title=a;
    const b=cv(ws.getCell(r,2));if(typeof b==='string'&&/in[ií]cio do projeto/i.test(b))start=dateIso(cv(ws.getCell(r,3)));
  }
  const rows=[];
  for(let r=hr+1;r<=ws.rowCount;r++){
    const name=cv(ws.getCell(r,1));
    const rest=[2,3,5,6,8].map(c=>cv(ws.getCell(r,c)));
    if(name==null&&rest.every(x=>x==null))continue;
    if(name==null)continue;
    if(rest.every(x=>x==null)){rows.push({type:'section',id:uid(),name:String(name)});continue}
    let p=cv(ws.getCell(r,3));p=typeof p==='number'?(p<=1?Math.round(p*100):Math.round(p)):0;
    const ec=ws.getCell(r,5);const ef=ec.value&&typeof ec.value==='object'&&ec.value.formula?ec.value.formula:'';
    const st=dateIso(cv(ec)),en=dateIso(cv(ws.getCell(r,6)));
    const after=/^F\d+\+1$/i.test(ef.replace(/\s/g,''))&&st!=null;
    rows.push({type:'task',id:uid(),name:String(name),owner:String(cv(ws.getCell(r,2))||''),progress:clamp(p,0,100),start:after?null:st,end:after?null:en,after,dur:after&&en?Math.max(1,dn(en)-dn(st)+1):null,note:String(cv(ws.getCell(r,8))||'')});
  }
  const s={id:uid(),title:title||file.name.replace(/\.xlsx$/i,''),projectStart:start||toISO(todayDn()),logo:'none',logoData:'',updatedAt:Date.now(),rows};
  return s;
}

  if(id==='bRes'){$('#fj').click();return}
  if(id==='bXlsx'){doExport();return}
  if(id==='bJson'){const r=await saveFile(fname(cur(),'json'),JSON.stringify({app:'gerador-cronogramas',version:1,items:[cur()]},null,1));if(r==='saved')toast('Backup salvo.');return}
  if(id==='bDel'){S.confirmDel=true;renderMain();return}
  if(id==='bDelNo'){S.confirmDel=false;renderMain();return}
  if(id==='bDelOk'){S.items=S.items.filter(x=>x.id!==S.cur);if(!S.items.length)S.items.push(blank());S.cur=S.items[0].id;S.confirmDel=false;S.drafts=[];S.target='';save();renderSide();renderMain();toast('Cronograma excluído.');return}
  if(id==='bCompact'){S.compact=!S.compact;renderSched();goToday();return}
  if(id==='bToday'){goToday();return}
  if(id==='aTask'||id==='aSec'){
    const s=cur();const o=id==='aSec'?{type:'section',id:uid(),name:'Nova seção'}:{type:'task',id:uid(),name:'Nova tarefa',owner:'',progress:0,start:toISO(todayDn()),end:toISO(todayDn()),after:false,dur:null,note:''};
    s.rows.push(o);S.flash.add(o.id);touch();renderSide();renderSched();
    const w=document.querySelector('.gwrap');if(w)w.scrollTop=w.scrollHeight;
    const inp=document.querySelector(`tr.new input`);if(inp){inp.focus();inp.select()}
    return;
  }
  if(id==='bParse'){const ta=$('#paste');const d=parseLines(ta.value);if(!d.length){toast('Cole ao menos uma linha.');return}
    if(S.drafts.length===1&&!S.drafts[0].name.trim())S.drafts=[];S.drafts.push(...d);renderNext();return}
  if(id==='bUndo'){const s2=cur();if(S.undo&&S.undo.sid===s2.id){s2.rows=S.undo.rows;S.undo=null;touch();renderSide();renderMain();toast('Última inserção desfeita.')}return}
  if(id==='bTpl'){
    if(typeof ExcelJS==='undefined'){toast('A biblioteca de Excel não carregou. Recarregue a página.');return}
    try{const buf=await buildTemplate();const r=await saveFile('Modelo_Proximos_Passos.xlsx',new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));if(r==='saved')toast('Modelo gerado: Modelo_Proximos_Passos.xlsx')}
    catch(err){console.error(err);toast('Não foi possível gerar o modelo: '+(err&&err.message||err))}
    return}
  if(id==='bUp'){$('#fp').click();return}
  if(id==='bAddD'){S.drafts.push(newDraft());renderNext();return}
  if(id==='bIns'){insertDrafts();return}
  if(a==='dx'){const k=+t.closest('.draft').dataset.k;S.drafts.splice(k,1);renderNext();return}
  if(a==='done'){const i=+t.closest('.pi').dataset.i;cur().rows[i].progress=100;touch();renderSide();renderNext();return}
  const tr=t.closest('tr[data-i]');
  if(tr&&a){
    const s=cur(),i=+tr.dataset.i,r=s.rows[i];
    if(a==='del'){s.rows.splice(i,1);touch();renderSide();renderSched();return}
    if(a==='up'&&i>0){[s.rows[i-1],s.rows[i]]=[s.rows[i],s.rows[i-1]];touch();renderSched();return}
    if(a==='down'&&i<s.rows.length-1){[s.rows[i+1],s.rows[i]]=[s.rows[i],s.rows[i+1]];touch();renderSched();return}
    if(a==='chain'){
      const R=resolve(s),x=R[i];
      if(!x.after){
        const hasPrev=s.rows.slice(0,i).some(q=>q.type==='task');
        if(!hasPrev){toast('Não há tarefa anterior para encadear.');return}
        r.dur=x.dias||Math.max(1,r.dur||5);r.after=true;
      }else{r.start=toISO(x.st);r.end=toISO(x.en);r.after=false}
      touch();renderSched();return;
    }
  }
});
document.addEventListener('submit',e=>{
  if(e.target.id==='fNew'){
    e.preventDefault();
    const name=$('#nnName').value.trim()||'Novo cronograma',st=$('#nnStart').value||toISO(todayDn());
    let n;
    if($('#nnBase').value==='copy'){n=JSON.parse(JSON.stringify(cur()));n.id=uid();n.rows.forEach(r=>r.id=uid());n.title=name;n.projectStart=st}
    else n=blank(name,st);
    S.items.unshift(n);S.cur=n.id;S.newOpen=false;S.drafts=[];S.target='';S.tab='sched';save();renderSide();renderMain();
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='title'){cur().title=t.value;touch();renderSide();return}
  if(t.id==='newSec'){S.newSec=t.value;return}
  if(t.dataset.d){const k=+t.closest('.draft').dataset.k,d=S.drafts[k],f=t.dataset.d;
    if(f==='after'){d.after=t.checked;const si=t.closest('.draft').querySelector('[data-d=start]');si.disabled=d.after;if(!d.after&&!d.start){d.start=toISO(todayDn());si.value=d.start}return}
    d[f]=f==='dur'?(t.value===''?'':parseInt(t.value)):t.value;return}
  const tr=t.closest('tr[data-i]');if(!tr||!t.dataset.f)return;
  const s=cur(),r=s.rows[+tr.dataset.i],f=t.dataset.f;
  if(f==='name'||f==='owner'||f==='note'){r[f]=t.value;touch()}
  else if(f==='secname'){r.name=t.value;touch()}
  else if(f==='progress'&&t.value!==''){r.progress=clamp(parseInt(t.value)||0,0,100);touch();refresh();renderSide()}
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.id==='pStart'){cur().projectStart=t.value;touch();return}
  if(t.id==='tgt'){S.target=t.value;renderNext();return}
  if(t.id==='logoSel'){
    const s=cur();
    if(t.value==='custom'&&!s.logoData){s.logo='none';renderMain();$('#fl').click();return}
    s.logo=t.value;touch();return;
  }
  if(t.id==='fl'){
    const f=t.files[0];t.value='';if(!f)return;
    if(f.size>1.5e6){toast('A imagem é grande demais (máx. 1,5 MB).');renderMain();return}
    const rd=new FileReader();rd.onload=()=>{const s=cur();s.logoData=rd.result;s.logo='custom';touch();renderMain();toast('Logo carregada.')};rd.readAsDataURL(f);return;
  }
  if(t.id==='fx'){
    const f=t.files[0];t.value='';if(!f)return;
    try{const n=await importXlsx(f);S.items.unshift(n);S.cur=n.id;S.tab='sched';S.drafts=[];S.target='';save();renderSide();renderMain();toast('Planilha importada: '+n.rows.filter(r=>r.type==='task').length+' tarefas.')}
    catch(err){console.error(err);toast('Não consegui importar: '+(err&&err.message||err))}
    return;
  }
  if(t.id==='fp'){const f=t.files[0];t.value='';if(f)await runImportSteps(f);return}
  if(t.id==='fj'){
    const f=t.files[0];t.value='';if(!f)return;
    try{const o=JSON.parse(await f.text());const its=(o.items||[]).filter(x=>x&&Array.isArray(x.rows));if(!its.length)throw new Error('arquivo sem cronogramas');
      its.forEach(x=>{x.id=uid();S.items.unshift(x)});S.cur=its[0].id;S.tab='sched';save();renderSide();renderMain();toast(its.length+' cronograma(s) restaurado(s).')}
    catch(err){toast('Backup inválido: '+(err&&err.message||err))}
    return;
  }
  if(t.dataset.p){const i=+t.closest('.pi').dataset.i;cur().rows[i].progress=clamp(parseInt(t.value)||0,0,100);touch();renderSide();renderNext();return}
  const tr=t.closest('tr[data-i]');if(!tr||!t.dataset.f)return;
  const s=cur(),i=+tr.dataset.i,r=s.rows[i],f=t.dataset.f,R=resolve(s),x=R[i];
  if(f==='progress'){r.progress=clamp(parseInt(t.value)||0,0,100);t.value=r.progress}
  else if(f==='start'){r.start=t.value||null;if(r.start&&(!r.end||dn(r.end)<dn(r.start)))r.end=r.start}
  else if(f==='end'){
    if(x.after){if(t.value&&x.st!=null)r.dur=Math.max(1,dn(t.value)-x.st+1)}
    else{r.end=t.value||null;if(r.end&&r.start&&dn(r.end)<dn(r.start))r.start=r.end}
  }else if(f==='dias'){
    const v=Math.max(1,parseInt(t.value)||1);
    if(x.after)r.dur=v;else if(x.st!=null)r.end=toISO(x.st+v-1);
  }
  afterEdit();
});

async function runImportSteps(f){
  if(typeof ExcelJS==='undefined'){toast('A biblioteca de Excel não carregou. Recarregue a página.');return}
  try{
    const r=await importSteps(f);
    if(!r.items.length){toast('Nenhum passo encontrado na planilha.'+(r.skipped?' As linhas de exemplo foram ignoradas.':''));return}
    applyBatch(r.items);
    finishBatch(r.items.length,r.items.length+(r.items.length>1?' passos importados':' passo importado')+' de '+f.name+'.');
  }catch(err){console.error(err);toast('Não consegui ler a planilha: '+(err&&err.message||err))}
}
['dragover','dragenter'].forEach(ev=>document.addEventListener(ev,e=>{const z=e.target.closest&&e.target.closest('#dz');if(z){e.preventDefault();z.classList.add('over')}}));
document.addEventListener('dragleave',e=>{const z=e.target.closest&&e.target.closest('#dz');if(z)z.classList.remove('over')});
document.addEventListener('drop',e=>{const z=e.target.closest&&e.target.closest('#dz');if(!z)return;e.preventDefault();z.classList.remove('over');const f=e.dataTransfer&&e.dataTransfer.files[0];if(f&&/\.xlsx$/i.test(f.name))runImportSteps(f);else toast('Envie um arquivo .xlsx.')});

load();renderSide();renderMain();
})();
</script>

</body></html>
